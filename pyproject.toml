[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sliceweave"
version = "1.1.0"
description = "Super-resolution reconstruction of 3-plane 2-D HASTE stacks into an isotropic volume (adult, paediatric and fetal brain MRI). Research use only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4", "python-gdcm>=3.0.20"]
test = ["pytest>=7", "requests>=2.28"]
validation = ["matplotlib>=3.7"]

[project.scripts]
sliceweave = "sliceweave.cli:main"

[tool.setuptools]
packages = ["sliceweave"]

[tool.setuptools.package-data]
sliceweave = ["web/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
